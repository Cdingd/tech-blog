{{ define "main" }}
<article class="post">
  <h1>{{ .Title }}</h1>
  <p class="post-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.author }}· {{ . }}{{ end }}
    {{ with .Params.tags }}· {{ delimit . " / " }}{{ end }}
  </p>
  <div class="post-content">{{ .Content }}</div>
</article>
{{ end }}
